<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!--LINK CSS-->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="balance-container">
            <h2>Your Balance</h2>
            <h1  id="balance"> $0.00</h1>
            <div class="income-expenses">
                <div class="income">
                    <p>Income</p>
                    <h3 id="income-amount">$0.00</h3>
                </div>
                <div class="expenses">
                    <p>Expenses</p>
                    <h3 id="expense-amount">$0.00</h3>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="transaction-container">
                <h2>Transactions</h2>
                    <ul id="transaction-list">
                        <!--TRANSACTION IT WILL BE INSERTED HERE-->
                    </ul>
            </div>

            <div class="form-container">
                <h2>Add Transaction</h2>


                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Enter description.." required />
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" placeholder="Enter amount.." required />
                        <small>Use negative (-) for expenses</small>
                    </div>
                    <button type="submit">Add Transaction</button>
                </form>
                
            </div>
        </div>
    </div>

    <!--SCRIPT FILE-->
    <script src="script.js"></script>
</body>
</html>
